<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101510">
  <meta name="description" content="Une galerie verticale de photos de vélos et de cyclisme.">
  <title>Les Photos du Cycliste</title>
  <style>
    :root{color-scheme:dark;background:#101510;color:#f4f4ed;font-family:Arial,Helvetica,sans-serif}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;background:#101510}
    main{width:min(100%,1100px);margin:0 auto;padding:0 18px}
    .gallery{display:flex;flex-direction:column;gap:18px;padding:18px 0}
    .photo{display:block;width:100%;height:auto;max-height:calc(100vh - 36px);object-fit:contain;cursor:zoom-in;background:#171e18;animation:appear .5s ease both}
    .photo:nth-child(2){animation-delay:.06s}.photo:nth-child(3){animation-delay:.12s}.photo:nth-child(4){animation-delay:.18s}.photo:nth-child(5){animation-delay:.24s}
    .viewer{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:24px;background:rgba(5,8,6,.94);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
    .viewer.open{opacity:1;visibility:visible}
    .viewer img{display:block;max-width:100%;max-height:calc(100vh - 48px);object-fit:contain;transform:scale(.97);transition:transform .2s}
    .viewer.open img{transform:scale(1)}
    .close{position:absolute;top:16px;right:18px;width:44px;height:44px;border:1px solid #ffffff70;border-radius:50%;background:#141a15;color:#fff;font-size:27px;line-height:1;cursor:pointer}
    @keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:600px){main{padding:0 10px}.gallery{gap:10px;padding:10px 0}.photo{max-height:none}.viewer{padding:12px}.viewer img{max-height:calc(100vh - 24px)}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main aria-label="Photos de vélo">
    <div class="gallery">
      <img class="photo" src="IMG_9122.JPG" alt="Vélo de route bleu et rose devant un mur de pierre" fetchpriority="high" decoding="async">
      <img class="photo" src="IMG_9123.JPG" alt="Vélo de route noir et violet devant une architecture blanche" loading="lazy" decoding="async">
      <img class="photo" src="IMG_9125.JPG" alt="Vélo de contre-la-montre devant un mur bleu" loading="lazy" decoding="async">
      <img class="photo" src="IMG_9127.JPG" alt="Vélo de course aérodynamique vert" loading="lazy" decoding="async">
      <img class="photo" src="IMG_9128.JPG" alt="Vélo de contre-la-montre bleu au bord de l'eau" loading="lazy" decoding="async">
    </div>
  </main>
  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Photo agrandie">
    <button class="close" type="button" aria-label="Fermer la photo">×</button>
    <img alt="">
  </div>
  <script>
    const viewer=document.getElementById('viewer');
    const enlarged=viewer.querySelector('img');
    function closeViewer(){viewer.classList.remove('open');document.body.style.overflow='';setTimeout(()=>{enlarged.removeAttribute('src');enlarged.alt=''},200)}
    document.querySelectorAll('.photo').forEach(photo=>photo.addEventListener('click',()=>{enlarged.src=photo.src;enlarged.alt=photo.alt;viewer.classList.add('open');document.body.style.overflow='hidden'}));
    viewer.querySelector('.close').addEventListener('click',closeViewer);
    viewer.addEventListener('click',event=>{if(event.target===viewer)closeViewer()});
    document.addEventListener('keydown',event=>{if(event.key==='Escape')closeViewer()});
  </script>
</body>
</html>
